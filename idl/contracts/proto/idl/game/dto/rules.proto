// What a game's rules are asked.

syntax = "proto3";

package idl.game.dto;

import "google/protobuf/any.proto";
import "idl/game/model/action.proto";
import "idl/game/model/game_spec.proto";
import "idl/game/model/game_state.proto";
import "idl/game/model/participant.proto";

option go_package = "boardgamez/contracts/gen/go/idl/game/dto;gamedto";

// Begin a game for these participants.
//
// One entry per participant, numbered 1 through N with no gap, each carrying
// the role it was seated with. `participant_count` is not read; the count is
// the length of `participant_roles`.
//
// `seed` is what every draw of chance in the game is taken from: a shuffle, a
// roll, a deal. Two games created for the same roster with the same seed are
// the same game, and a state carries whatever the sequence needs to continue.
// A game with no chance in it does not read it.
message CreateGameRequest {
  uint32 participant_count = 1;
  repeated idl.game.model.ParticipantRole participant_roles = 2;
  uint64 seed = 3;
}

message CreateGameResponse {
  idl.game.model.GameState state = 1;  // Unset when the game does not take these participants.
}

// Play one action against one state.
//
// The state is carried in full, so nothing about a game in progress is held
// between calls.
message ApplyActionRequest {
  idl.game.model.GameState state = 1;
  idl.game.model.Action action = 2;
}

message ApplyActionResponse {
  idl.game.model.GameState state = 1;  // Unset when the action is not legal in that state.
}

// The game as one participant may see it, and what they may do next.
message ReadViewRequest {
  idl.game.model.GameState state = 1;
  uint32 participant = 2;  // 0 for someone who is not playing.
}

message ReadViewResponse {
  google.protobuf.Any view = 1;  // The game's own view type.
}

// Take one participant out of a game being played.
//
// Asked when a participant leaves the table, in or out of turn, and only while
// the game has no result. What leaving means is the game's own: a resignation,
// a removal, holdings returned to the pile. The state answered carries whatever
// that is, and a result once the game cannot go on.
message WithdrawParticipantRequest {
  idl.game.model.GameState state = 1;
  uint32 participant = 2;
}

message WithdrawParticipantResponse {
  idl.game.model.GameState state = 1;  // Unset when the participant is not in the game.
}

// What a state becomes when its deadline passes with nobody acting.
//
// Asked when `acts_within` has run out on a state no write has replaced, and
// never once the game has a result. What passing means is the game's own: a
// fight resolves, a card is drawn for the player who did not, a side loses on
// time. The state answered carries the next deadline, if there is one.
message ExpireDeadlineRequest {
  idl.game.model.GameState state = 1;
}

message ExpireDeadlineResponse {
  idl.game.model.GameState state = 1;  // Unset when the state carries no deadline.
}

message ReadBoundsRequest {}

message ReadBoundsResponse {
  idl.game.model.ParticipantBounds bounds = 1;
}
