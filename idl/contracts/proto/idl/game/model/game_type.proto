// Which game's rules are being played.

syntax = "proto3";

package idl.game.model;

option go_package = "boardgamez/contracts/gen/go/idl/game/model;gamemodel";

// The games this system knows how to host.
//
// The session layer routes on this value and knows nothing else about a game.
enum GameType {
  GAME_TYPE_UNSPECIFIED = 0;
  GAME_TYPE_CHESS = 1;
}
