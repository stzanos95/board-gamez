// Starting a game, reading it, and doing something in it.

syntax = "proto3";

package idl.game.service;

import "google/api/annotations.proto";
import "idl/game/dto/command.proto";
import "idl/game/dto/session.proto";

option go_package = "boardgamez/contracts/gen/go/idl/game/service;gameservice";

// A game being played, and the one way to change one.
//
// A game changes by applying a command and in no other way. There is no write of
// a state, so no caller can set one.
service SessionService {
  rpc CreateSession(idl.game.dto.CreateSessionRequest) returns (idl.game.dto.CreateSessionResponse) {
    option (google.api.http) = {
      post: "/internal/platform/game/create/session"
      body: "*"
    };
  }

  rpc ReadSession(idl.game.dto.ReadSessionRequest) returns (idl.game.dto.ReadSessionResponse) {
    option (google.api.http) = {
      post: "/internal/platform/game/read/session"
      body: "*"
    };
  }

  rpc ApplyCommand(idl.game.dto.ApplyCommandRequest) returns (idl.game.dto.ApplyCommandResponse) {
    option (google.api.http) = {
      post: "/internal/platform/game/apply/command"
      body: "*"
    };
  }
}
