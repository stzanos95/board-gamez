// Reading and writing tables.

syntax = "proto3";

package idl.lobby.service;

import "google/api/annotations.proto";
import "idl/lobby/dto/table.proto";

option go_package = "boardgamez/contracts/gen/go/idl/lobby/service;lobbyservice";

// Storage for tables.
//
// Four methods and no domain verbs. Joining a seat and leaving one are decided
// above this layer and arrive here as a write of the whole table, guarded by the
// version it was read at.
service TableService {
  rpc UpsertTable(idl.lobby.dto.UpsertTableRequest) returns (idl.lobby.dto.UpsertTableResponse) {
    option (google.api.http) = {
      post: "/internal/platform/lobby/upsert/table"
      body: "*"
    };
  }

  rpc ReadTable(idl.lobby.dto.ReadTableRequest) returns (idl.lobby.dto.ReadTableResponse) {
    option (google.api.http) = {
      post: "/internal/platform/lobby/read/table"
      body: "*"
    };
  }

  rpc DeleteTable(idl.lobby.dto.DeleteTableRequest) returns (idl.lobby.dto.DeleteTableResponse) {
    option (google.api.http) = {
      post: "/internal/platform/lobby/delete/table"
      body: "*"
    };
  }

  rpc ListTable(idl.lobby.dto.ListTableRequest) returns (idl.lobby.dto.ListTableResponse) {
    option (google.api.http) = {
      post: "/internal/platform/lobby/list/table"
      body: "*"
    };
  }
}
