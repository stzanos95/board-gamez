// How a change to a player's place at a table ended.

syntax = "proto3";

package idl.lobby.model;

import "idl/lobby/model/table.proto";

option go_package = "boardgamez/contracts/gen/go/idl/lobby/model;lobbymodel";

// Every way a change to a player's place at a table ends.
//
// CREATED, JOINED, TAKEN, VACATED and LEFT are the changes made. VERSION_MOVED
// means the table changed while the change was being written, and the table
// answered with it is the one to act on next. NOT_OFFERED means the choice is
// not one the game offers this player at this table now: the seat is taken,
// the player is already seated, or the table is not waiting for players.
// NOT_ACCEPTING_PLAYERS refuses a table whose game has begun or ended, and
// TABLE_FULL one whose every seat is taken. GAME_NOT_HOSTED and
// SEAT_COUNT_NOT_ALLOWED refuse a table before it exists.
enum SeatOutcome {
  SEAT_OUTCOME_UNSPECIFIED = 0;
  SEAT_OUTCOME_TAKEN = 1;
  SEAT_OUTCOME_TABLE_NOT_FOUND = 2;
  SEAT_OUTCOME_NOT_OFFERED = 3;
  SEAT_OUTCOME_VERSION_MOVED = 4;
  SEAT_OUTCOME_VACATED = 5;
  SEAT_OUTCOME_LEFT = 6;
  SEAT_OUTCOME_NOT_SEATED = 7;
  SEAT_OUTCOME_NOT_AT_TABLE = 8;
  SEAT_OUTCOME_CREATED = 9;
  SEAT_OUTCOME_JOINED = 10;
  SEAT_OUTCOME_ALREADY_AT_TABLE = 11;
  SEAT_OUTCOME_NOT_ACCEPTING_PLAYERS = 12;
  SEAT_OUTCOME_GAME_NOT_HOSTED = 13;
  SEAT_OUTCOME_SEAT_COUNT_NOT_ALLOWED = 14;
  SEAT_OUTCOME_TABLE_FULL = 15;
}

// What happened to a player's place at a table, and the table as it now stands.
//
// The table is carried whatever the outcome, and is unset only when no table has
// the id the change named.
message SeatResult {
  SeatOutcome outcome = 1;
  Table table = 2;
}
