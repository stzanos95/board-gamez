// The two things every chessman is: whose it is, and what it is.

syntax = "proto3";

package idl.chess.model;

option go_package = "boardgamez/contracts/gen/go/idl/chess/model;chessmodel";

// Which side a piece belongs to.
//
// COLOR_UNSPECIFIED is never written by a producer. A reader sees it when the
// field was not set.
enum Color {
  COLOR_UNSPECIFIED = 0;
  COLOR_WHITE = 1;
  COLOR_BLACK = 2;
}

// The six types of chessman.
enum PieceType {
  PIECE_TYPE_UNSPECIFIED = 0;
  PIECE_TYPE_PAWN = 1;
  PIECE_TYPE_KNIGHT = 2;
  PIECE_TYPE_BISHOP = 3;
  PIECE_TYPE_ROOK = 4;
  PIECE_TYPE_QUEEN = 5;
  PIECE_TYPE_KING = 6;
}

// Whose piece stands on a square, and what type.
//
// Carries no identity. Two knights of the same colour are interchangeable.
message Occupant {
  Color color = 1;
  PieceType piece_type = 2;
}
