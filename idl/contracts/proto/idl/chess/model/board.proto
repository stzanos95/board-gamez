// A position, and what makes two positions the same.

syntax = "proto3";

package idl.chess.model;

option go_package = "boardgamez/contracts/gen/go/idl/chess/model;chessmodel";

import "idl/chess/model/castling.proto";
import "idl/chess/model/piece.proto";
import "idl/chess/model/square.proto";

// One square and the piece standing on it.
//
// Lets a whole position travel as a list. proto3 cannot key a map by a message,
// and a position is naturally keyed by Square.
message SquareOccupant {
  Square square = 1;
  Occupant occupant = 2;
}

// A complete position: pieces, side to move, castling rights, en-passant target
// and both clocks.
//
// Only occupied squares appear in occupancy, and order carries nothing.
message BoardState {
  repeated SquareOccupant occupancy = 1;
  Color side_to_move = 2;
  CastlingRights castling_rights = 3;

  // The square a pawn may capture onto this move, set by a double push. Absent
  // when the previous move was not one.
  Square en_passant_target = 4;

  // Plies since the last capture or pawn move. Reaching 100 draws the game.
  uint32 halfmove_clock = 5;

  // Starts at 1 and increases after Black moves.
  uint32 fullmove_number = 6;
}

// What makes two positions the same for the repetition rule.
//
// The same pieces on the same squares, the same side to move, the same castling
// rights and the same en-passant square. The clocks are deliberately absent:
// they differ between repetitions of one position.
message PositionKey {
  repeated SquareOccupant occupancy = 1;
  Color side_to_move = 2;
  CastlingRights castling_rights = 3;
  Square en_passant_target = 4;
}
