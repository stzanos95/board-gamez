// What a message looks like while it is on a socket.

syntax = "proto3";

package idl.core.dto;

import "google/protobuf/any.proto";
import "google/protobuf/timestamp.proto";

option go_package = "boardgamez/contracts/gen/go/idl/core/dto;coredto";

// What the socket layer reads about a frame without opening it.
//
// Each domain owns the values it sends as `type`, and nothing here validates
// them: an unrecognised type is decided at run time.
message WebsocketMessageHeader {
  string id = 1;    // Unique per frame.
  string type = 2;  // What this frame means, and all a router reads.
  google.protobuf.Timestamp timestamp = 3;  // Emission, not receipt.
}

// One frame on a socket, in either direction.
//
// The header is all the transport reads. The payload is packed by the domain
// that produced it and opened only by the domain that consumes it.
message WebsocketMessageEnvelope {
  WebsocketMessageHeader header = 1;
  google.protobuf.Any payload = 2;
}
