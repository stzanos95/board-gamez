// What a message looks like while it is on a queue.

syntax = "proto3";

package idl.core.dto;

import "google/protobuf/any.proto";
import "google/protobuf/timestamp.proto";

option go_package = "boardgamez/contracts/gen/go/idl/core/dto;coredto";

// What a broker and a consumer read about a message without opening it.
//
// Each domain owns the values it publishes as `type`, and nothing here validates
// them. A message read off a queue may be arbitrarily old: treating receipt as
// occurrence orders events wrongly under any backlog.
message QueueMessageHeader {
  string id = 1;    // Unique per message, and what recognises a redelivery.
  string type = 2;  // What this message means, and what a consumer subscribes on.
  google.protobuf.Timestamp timestamp = 3;  // Emission, not enqueue or delivery.
}

// One message on a queue.
//
// The header is all the transport reads. The payload is packed by the domain
// that produced it and opened only by the domain that consumes it.
message QueueMessageEnvelope {
  QueueMessageHeader header = 1;
  google.protobuf.Any payload = 2;
}
