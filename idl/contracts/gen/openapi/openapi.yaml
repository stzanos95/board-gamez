components:
    schemas:
        google.protobuf.Any:
            type: object
            properties:
                '@type':
                    type: string
                    description: The type of the serialized message.
            additionalProperties: true
            description: Contains an arbitrary serialized message along with a @type that describes the type of the serialized message.
        google.rpc.Status:
            type: object
            properties:
                code:
                    type: integer
                    description: The status code, which should be an enum value of [google.rpc.Code][google.rpc.Code].
                    format: int32
                message:
                    type: string
                    description: A developer-facing error message, which should be in English. Any user-facing error message should be localized and sent in the [google.rpc.Status.details][google.rpc.Status.details] field, or localized by the client.
                details:
                    type: array
                    items:
                        $ref: '#/components/schemas/google.protobuf.Any'
                    description: A list of messages that carry the error details.  There is a common set of message types for APIs to use.
            description: 'The `Status` type defines a logical error model that is suitable for different programming environments, including REST APIs and RPC APIs. It is used by [gRPC](https://github.com/grpc). Each `Status` message contains three pieces of data: error code, error message, and error details. You can find out more about this error model and how to work with it in the [API Design Guide](https://cloud.google.com/apis/design/errors).'
        idl.chess.dto.ListSeatChoiceRequest:
            type: object
            properties:
                tableId:
                    type: string
                playerId:
                    type: string
            description: The seats this player may take at this table now.
        idl.chess.dto.ListSeatChoiceResponse:
            type: object
            properties:
                collection:
                    $ref: '#/components/schemas/idl.chess.model.ChessSeatChoiceCollection'
        idl.chess.dto.PlayActionRequest:
            type: object
            properties:
                tableId:
                    type: string
                commandId:
                    type: string
                playerId:
                    type: string
                action:
                    $ref: '#/components/schemas/idl.chess.model.ChessAction'
                expectedVersion:
                    type: string
            description: |-
                One thing a player does in a game.

                 `command_id` is minted by the caller. Sending an action a second time applies
                 nothing and answers the game the first one produced.

                 `expected_version` is the version of the session the action was built against.
                 An action carrying an earlier one is refused, so an action never reaches the
                 game in a position the player who chose it had not seen.

                 The acting side is not carried. It is found from `player_id`, so a request
                 cannot act for a side its sender does not play.
        idl.chess.dto.PlayActionResponse:
            type: object
            properties:
                result:
                    $ref: '#/components/schemas/idl.chess.model.ActionResult'
        idl.chess.dto.ReadGameRequest:
            type: object
            properties:
                tableId:
                    type: string
                playerId:
                    type: string
        idl.chess.dto.ReadGameResponse:
            type: object
            properties:
                session:
                    $ref: '#/components/schemas/idl.chess.model.ChessSession'
        idl.chess.dto.ReadTableRequest:
            type: object
            properties:
                tableId:
                    type: string
        idl.chess.dto.ReadTableResponse:
            type: object
            properties:
                table:
                    $ref: '#/components/schemas/idl.chess.model.ChessTable'
        idl.chess.dto.StartGameRequest:
            type: object
            properties:
                tableId:
                    type: string
                playerId:
                    type: string
            description: |-
                Start a game at a table.

                 Each seat's side is the side its player took it with. A table already playing
                 a game starts nothing and answers the game already there.
        idl.chess.dto.StartGameResponse:
            type: object
            properties:
                session:
                    $ref: '#/components/schemas/idl.chess.model.ChessSession'
        idl.chess.dto.TakeSeatRequest:
            type: object
            properties:
                tableId:
                    type: string
                playerId:
                    type: string
                choice:
                    $ref: '#/components/schemas/idl.chess.model.ChessSeatChoice'
                expectedVersion:
                    type: string
            description: |-
                Take one seat, as one of the choices the player was offered.

                 `expected_version` is the version of the table the choice was picked from. A
                 choice carrying an earlier one is refused, so a seat is never taken at a table
                 the player had not seen.
        idl.chess.dto.TakeSeatResponse:
            type: object
            properties:
                result:
                    $ref: '#/components/schemas/idl.chess.model.ChessSeatResult'
        idl.chess.model.ActionResult:
            type: object
            properties:
                outcome:
                    enum:
                        - COMMAND_OUTCOME_UNSPECIFIED
                        - COMMAND_OUTCOME_APPLIED
                        - COMMAND_OUTCOME_ALREADY_APPLIED
                        - COMMAND_OUTCOME_SESSION_NOT_FOUND
                        - COMMAND_OUTCOME_NOT_A_PARTICIPANT
                        - COMMAND_OUTCOME_GAME_OVER
                        - COMMAND_OUTCOME_VERSION_MOVED
                        - COMMAND_OUTCOME_OUT_OF_TURN
                        - COMMAND_OUTCOME_ILLEGAL_ACTION
                    type: string
                    format: enum
                session:
                    $ref: '#/components/schemas/idl.chess.model.ChessSession'
            description: |-
                What happened to an action, and the game as its sender may now see it.

                 The session is carried whatever the outcome, and is unset only when no game is
                 being played at the table the action named.
        idl.chess.model.BoardState:
            type: object
            properties:
                occupancy:
                    type: array
                    items:
                        $ref: '#/components/schemas/idl.chess.model.SquareOccupant'
                sideToMove:
                    enum:
                        - COLOR_UNSPECIFIED
                        - COLOR_WHITE
                        - COLOR_BLACK
                    type: string
                    format: enum
                castlingRights:
                    $ref: '#/components/schemas/idl.chess.model.CastlingRights'
                enPassantTarget:
                    $ref: '#/components/schemas/idl.chess.model.Square'
                halfmoveClock:
                    type: integer
                    format: uint32
                fullmoveNumber:
                    type: integer
                    format: uint32
            description: |-
                A complete position: pieces, side to move, castling rights, en-passant target
                 and both clocks.

                 Only occupied squares appear in occupancy, and order carries nothing.
        idl.chess.model.CastlingRight:
            type: object
            properties:
                color:
                    enum:
                        - COLOR_UNSPECIFIED
                        - COLOR_WHITE
                        - COLOR_BLACK
                    type: string
                    format: enum
                side:
                    enum:
                        - CASTLING_SIDE_UNSPECIFIED
                        - CASTLING_SIDE_KINGSIDE
                        - CASTLING_SIDE_QUEENSIDE
                    type: string
                    format: enum
            description: One side's claim to one of its two castles.
        idl.chess.model.CastlingRights:
            type: object
            properties:
                available:
                    type: array
                    items:
                        $ref: '#/components/schemas/idl.chess.model.CastlingRight'
            description: |-
                Which castles remain available.

                 A right survives until the king or the matching rook moves, or that rook is
                 captured. It does not say whether the castle is legal now: that also depends
                 on occupancy and on which squares the enemy attacks.

                 The list is a set. Order carries nothing, and a right appears at most once.
        idl.chess.model.ChessAction:
            type: object
            properties:
                move:
                    $ref: '#/components/schemas/idl.chess.model.CoordinateMove'
                resignation:
                    $ref: '#/components/schemas/idl.chess.model.Resignation'
            description: 'One thing a player does: play a move, or resign.'
        idl.chess.model.ChessGame:
            type: object
            properties:
                roster:
                    $ref: '#/components/schemas/idl.chess.model.PlayerRoster'
                state:
                    $ref: '#/components/schemas/idl.chess.model.BoardState'
                history:
                    $ref: '#/components/schemas/idl.chess.model.ChessTurnHistory'
                legalMoves:
                    type: array
                    items:
                        $ref: '#/components/schemas/idl.chess.model.Move'
                status:
                    enum:
                        - GAME_STATUS_UNSPECIFIED
                        - GAME_STATUS_IN_PROGRESS
                        - GAME_STATUS_CHECK
                        - GAME_STATUS_CHECKMATE
                        - GAME_STATUS_STALEMATE
                        - GAME_STATUS_DRAW_BY_FIFTY_MOVE_RULE
                        - GAME_STATUS_DRAW_BY_REPETITION
                        - GAME_STATUS_DRAW_BY_INSUFFICIENT_MATERIAL
                    type: string
                    format: enum
                resigningColor:
                    enum:
                        - COLOR_UNSPECIFIED
                        - COLOR_WHITE
                        - COLOR_BLACK
                    type: string
                    format: enum
                result:
                    $ref: '#/components/schemas/idl.chess.model.GameResult'
            description: 'A game in progress: the players, the position, and the moves played.'
        idl.chess.model.ChessPlayer:
            type: object
            properties:
                color:
                    enum:
                        - COLOR_UNSPECIFIED
                        - COLOR_WHITE
                        - COLOR_BLACK
                    type: string
                    format: enum
                participant:
                    type: integer
                    format: uint32
            description: |-
                Which side one participant plays.

                 A participant is known here by number and nothing else. A name is joined in by
                 whoever draws the game.
        idl.chess.model.ChessSeat:
            type: object
            properties:
                number:
                    type: integer
                    format: uint32
                status:
                    enum:
                        - SEAT_STATUS_UNSPECIFIED
                        - SEAT_STATUS_OPEN
                        - SEAT_STATUS_OCCUPIED
                    type: string
                    format: enum
                playerId:
                    type: string
                color:
                    enum:
                        - COLOR_UNSPECIFIED
                        - COLOR_WHITE
                        - COLOR_BLACK
                    type: string
                    format: enum
            description: One seat at a chess table, with the side it plays opened.
        idl.chess.model.ChessSeatChoice:
            type: object
            properties:
                number:
                    type: integer
                    format: uint32
                color:
                    enum:
                        - COLOR_UNSPECIFIED
                        - COLOR_WHITE
                        - COLOR_BLACK
                    type: string
                    format: enum
            description: |-
                One seat a player may take right now, and the side they would play in it.

                 Taken unchanged: the seat and the side are a pair.
        idl.chess.model.ChessSeatChoiceCollection:
            type: object
            properties:
                chessSeatChoiceItems:
                    type: array
                    items:
                        $ref: '#/components/schemas/idl.chess.model.ChessSeatChoice'
            description: Every seat one player may take.
        idl.chess.model.ChessSeatResult:
            type: object
            properties:
                outcome:
                    enum:
                        - SEAT_OUTCOME_UNSPECIFIED
                        - SEAT_OUTCOME_TAKEN
                        - SEAT_OUTCOME_TABLE_NOT_FOUND
                        - SEAT_OUTCOME_NOT_OFFERED
                        - SEAT_OUTCOME_VERSION_MOVED
                        - SEAT_OUTCOME_VACATED
                        - SEAT_OUTCOME_LEFT
                        - SEAT_OUTCOME_NOT_SEATED
                        - SEAT_OUTCOME_NOT_AT_TABLE
                        - SEAT_OUTCOME_CREATED
                        - SEAT_OUTCOME_JOINED
                        - SEAT_OUTCOME_ALREADY_AT_TABLE
                        - SEAT_OUTCOME_NOT_ACCEPTING_PLAYERS
                        - SEAT_OUTCOME_GAME_NOT_HOSTED
                        - SEAT_OUTCOME_SEAT_COUNT_NOT_ALLOWED
                    type: string
                    format: enum
                table:
                    $ref: '#/components/schemas/idl.chess.model.ChessTable'
            description: |-
                What happened to a seat being taken, and the table as its taker may now see it.

                 The table is carried whatever the outcome, and is unset only when no table
                 has the id the choice named.
        idl.chess.model.ChessSession:
            type: object
            properties:
                id:
                    type: string
                game:
                    $ref: '#/components/schemas/idl.chess.model.ChessGame'
                color:
                    enum:
                        - COLOR_UNSPECIFIED
                        - COLOR_WHITE
                        - COLOR_BLACK
                    type: string
                    format: enum
                lastCommandId:
                    type: string
                version:
                    type: string
                participantStatuses:
                    type: array
                    items:
                        $ref: '#/components/schemas/idl.game.model.ParticipantStatus'
            description: |-
                One game of chess being played, projected for one viewer.

                 The id is the id of the table the game is played at, so a table holds one
                 game at a time.

                 `color` is the side the viewer plays, and is unset for someone who is not
                 playing. Which side may act next is read from the game's own state.

                 `version` counts writes to the game. An action is built against the version
                 it was read at, and a session is rendered only when its version is above the
                 version showing.
        idl.chess.model.ChessTable:
            type: object
            properties:
                id:
                    type: string
                status:
                    enum:
                        - TABLE_STATUS_UNSPECIFIED
                        - TABLE_STATUS_WAITING
                        - TABLE_STATUS_IN_PROGRESS
                        - TABLE_STATUS_FINISHED
                        - TABLE_STATUS_ABANDONED
                    type: string
                    format: enum
                seats:
                    type: array
                    items:
                        $ref: '#/components/schemas/idl.chess.model.ChessSeat'
                playerIds:
                    type: array
                    items:
                        type: string
                version:
                    type: string
            description: |-
                A table chess is played at, with every seat's side opened.

                 `version` is the table's, and a choice is taken against it.
        idl.chess.model.ChessTurn:
            type: object
            properties:
                number:
                    type: integer
                    format: uint32
                player:
                    $ref: '#/components/schemas/idl.chess.model.ChessPlayer'
                move:
                    $ref: '#/components/schemas/idl.chess.model.Move'
                notation:
                    type: string
                resultingStatus:
                    enum:
                        - GAME_STATUS_UNSPECIFIED
                        - GAME_STATUS_IN_PROGRESS
                        - GAME_STATUS_CHECK
                        - GAME_STATUS_CHECKMATE
                        - GAME_STATUS_STALEMATE
                        - GAME_STATUS_DRAW_BY_FIFTY_MOVE_RULE
                        - GAME_STATUS_DRAW_BY_REPETITION
                        - GAME_STATUS_DRAW_BY_INSUFFICIENT_MATERIAL
                    type: string
                    format: enum
            description: |-
                One move that was played, with its written form.

                 The notation is standard algebraic — "Nf3", "exd5", "O-O", "e8=Q#" — never
                 coordinate text. It is stored because rendering it needs the position the move
                 was played from, which a reader of the history no longer has.
        idl.chess.model.ChessTurnHistory:
            type: object
            properties:
                turns:
                    type: array
                    items:
                        $ref: '#/components/schemas/idl.chess.model.ChessTurn'
                positionKeys:
                    type: array
                    items:
                        $ref: '#/components/schemas/idl.chess.model.PositionKey'
            description: |-
                The turns played, and the position after each of them.

                 position_keys runs one ahead of turns: the opening position counts as visited
                 before either player has moved.
        idl.chess.model.CoordinateMove:
            type: object
            properties:
                origin:
                    $ref: '#/components/schemas/idl.chess.model.Square'
                destination:
                    $ref: '#/components/schemas/idl.chess.model.Square'
                promotionType:
                    enum:
                        - PIECE_TYPE_UNSPECIFIED
                        - PIECE_TYPE_PAWN
                        - PIECE_TYPE_KNIGHT
                        - PIECE_TYPE_BISHOP
                        - PIECE_TYPE_ROOK
                        - PIECE_TYPE_QUEEN
                        - PIECE_TYPE_KING
                    type: string
                    format: enum
            description: |-
                A move as a player names it: the square left, the square reached and, for a
                 pawn reaching the last rank, what it becomes.

                 Which piece moves, whether it captures and how it castles are not carried.
                 They are settled by matching this against the legal moves of the position.
        idl.chess.model.GameResult:
            type: object
            properties:
                outcome:
                    enum:
                        - GAME_OUTCOME_UNSPECIFIED
                        - GAME_OUTCOME_WHITE_WINS
                        - GAME_OUTCOME_BLACK_WINS
                        - GAME_OUTCOME_DRAW
                    type: string
                    format: enum
                winner:
                    $ref: '#/components/schemas/idl.chess.model.ChessPlayer'
                status:
                    enum:
                        - GAME_STATUS_UNSPECIFIED
                        - GAME_STATUS_IN_PROGRESS
                        - GAME_STATUS_CHECK
                        - GAME_STATUS_CHECKMATE
                        - GAME_STATUS_STALEMATE
                        - GAME_STATUS_DRAW_BY_FIFTY_MOVE_RULE
                        - GAME_STATUS_DRAW_BY_REPETITION
                        - GAME_STATUS_DRAW_BY_INSUFFICIENT_MATERIAL
                    type: string
                    format: enum
                resigningPlayer:
                    $ref: '#/components/schemas/idl.chess.model.ChessPlayer'
            description: |-
                How a game finished.

                 Exactly one of status and resigning_player is set. A game decided on the board
                 carries the status that ended it; a game decided by resignation carries the
                 player who resigned. winner is absent for a draw.
        idl.chess.model.Move:
            type: object
            properties:
                origin:
                    $ref: '#/components/schemas/idl.chess.model.Square'
                destination:
                    $ref: '#/components/schemas/idl.chess.model.Square'
                movingColor:
                    enum:
                        - COLOR_UNSPECIFIED
                        - COLOR_WHITE
                        - COLOR_BLACK
                    type: string
                    format: enum
                movingPieceType:
                    enum:
                        - PIECE_TYPE_UNSPECIFIED
                        - PIECE_TYPE_PAWN
                        - PIECE_TYPE_KNIGHT
                        - PIECE_TYPE_BISHOP
                        - PIECE_TYPE_ROOK
                        - PIECE_TYPE_QUEEN
                        - PIECE_TYPE_KING
                    type: string
                    format: enum
                moveType:
                    enum:
                        - MOVE_TYPE_UNSPECIFIED
                        - MOVE_TYPE_QUIET
                        - MOVE_TYPE_CAPTURE
                        - MOVE_TYPE_DOUBLE_PAWN_PUSH
                        - MOVE_TYPE_EN_PASSANT
                        - MOVE_TYPE_CASTLE
                        - MOVE_TYPE_PROMOTION
                        - MOVE_TYPE_PROMOTION_CAPTURE
                    type: string
                    format: enum
                capturedSquare:
                    $ref: '#/components/schemas/idl.chess.model.Square'
                promotionType:
                    enum:
                        - PIECE_TYPE_UNSPECIFIED
                        - PIECE_TYPE_PAWN
                        - PIECE_TYPE_KNIGHT
                        - PIECE_TYPE_BISHOP
                        - PIECE_TYPE_ROOK
                        - PIECE_TYPE_QUEEN
                        - PIECE_TYPE_KING
                    type: string
                    format: enum
                castlingSide:
                    enum:
                        - CASTLING_SIDE_UNSPECIFIED
                        - CASTLING_SIDE_KINGSIDE
                        - CASTLING_SIDE_QUEENSIDE
                    type: string
                    format: enum
                rookOrigin:
                    $ref: '#/components/schemas/idl.chess.model.Square'
                rookDestination:
                    $ref: '#/components/schemas/idl.chess.model.Square'
            description: |-
                One move, complete enough for a board to apply without deriving anything.

                 The mover is carried as colour and type.

                 captured_square differs from destination for en passant. The rook fields are
                 set only for a castle. A field that does not apply is left unset.
        idl.chess.model.Occupant:
            type: object
            properties:
                color:
                    enum:
                        - COLOR_UNSPECIFIED
                        - COLOR_WHITE
                        - COLOR_BLACK
                    type: string
                    format: enum
                pieceType:
                    enum:
                        - PIECE_TYPE_UNSPECIFIED
                        - PIECE_TYPE_PAWN
                        - PIECE_TYPE_KNIGHT
                        - PIECE_TYPE_BISHOP
                        - PIECE_TYPE_ROOK
                        - PIECE_TYPE_QUEEN
                        - PIECE_TYPE_KING
                    type: string
                    format: enum
            description: |-
                Whose piece stands on a square, and what type.

                 Carries no identity. Two knights of the same colour are interchangeable.
        idl.chess.model.PlayerRoster:
            type: object
            properties:
                white:
                    $ref: '#/components/schemas/idl.chess.model.ChessPlayer'
                black:
                    $ref: '#/components/schemas/idl.chess.model.ChessPlayer'
            description: |-
                The two players, addressable by colour.

                 white.color is always COLOR_WHITE, and black.color COLOR_BLACK.
        idl.chess.model.PositionKey:
            type: object
            properties:
                occupancy:
                    type: array
                    items:
                        $ref: '#/components/schemas/idl.chess.model.SquareOccupant'
                sideToMove:
                    enum:
                        - COLOR_UNSPECIFIED
                        - COLOR_WHITE
                        - COLOR_BLACK
                    type: string
                    format: enum
                castlingRights:
                    $ref: '#/components/schemas/idl.chess.model.CastlingRights'
                enPassantTarget:
                    $ref: '#/components/schemas/idl.chess.model.Square'
            description: |-
                What makes two positions the same for the repetition rule.

                 The same pieces on the same squares, the same side to move, the same castling
                 rights and the same en-passant square. The clocks are excluded: they differ
                 between repetitions of one position.
        idl.chess.model.Resignation:
            type: object
            properties: {}
            description: Giving up the game.
        idl.chess.model.Square:
            type: object
            properties:
                file:
                    enum:
                        - FILE_UNSPECIFIED
                        - FILE_A
                        - FILE_B
                        - FILE_C
                        - FILE_D
                        - FILE_E
                        - FILE_F
                        - FILE_G
                        - FILE_H
                    type: string
                    format: enum
                rank:
                    enum:
                        - RANK_UNSPECIFIED
                        - RANK_1
                        - RANK_2
                        - RANK_3
                        - RANK_4
                        - RANK_5
                        - RANK_6
                        - RANK_7
                        - RANK_8
                    type: string
                    format: enum
            description: |-
                One of the sixty-four squares, named by its file and rank.

                 The algebraic spelling "e4" is derived from this, and is not carried.
        idl.chess.model.SquareOccupant:
            type: object
            properties:
                square:
                    $ref: '#/components/schemas/idl.chess.model.Square'
                occupant:
                    $ref: '#/components/schemas/idl.chess.model.Occupant'
            description: |-
                One square and the piece standing on it.

                 A position travels as a list of these.
        idl.game.dto.ApplyCommandRequest:
            type: object
            properties:
                sessionId:
                    type: string
                commandId:
                    type: string
                playerId:
                    type: string
                action:
                    $ref: '#/components/schemas/google.protobuf.Any'
                expectedVersion:
                    type: string
            description: |-
                One thing a player does in a game.

                 `command_id` is minted by the caller and names one decision. A command sent
                 again unchanged applies nothing: it is answered the state the first one
                 produced, or VERSION_MOVED once the game has moved on from it, and the state
                 answered then already carries what the first one did. A command built again
                 on a newer state is a new decision and carries a new id.

                 `expected_version` is the version of the view the action was built against. A
                 command carrying an earlier one is refused, so an action never reaches a game
                 in a state the player who chose it had not seen.

                 The acting participant is not carried. It is found from `player_id`, so a
                 request cannot name a participant its sender is not.
        idl.game.dto.ApplyCommandResponse:
            type: object
            properties:
                result:
                    $ref: '#/components/schemas/idl.game.model.CommandResult'
        idl.game.dto.CreateSessionRequest:
            type: object
            properties:
                tableId:
                    type: string
                playerId:
                    type: string
                gameType:
                    enum:
                        - GAME_TYPE_UNSPECIFIED
                        - GAME_TYPE_CHESS
                        - GAME_TYPE_UNO
                    type: string
                    format: enum
                participants:
                    type: array
                    items:
                        $ref: '#/components/schemas/idl.game.model.Participant'
            description: |-
                Start a game at a table.

                 The table's id becomes the game's id, so starting a game at a table that is
                 already playing one starts nothing and answers the game already there.

                 Participants are built by the caller from the table's seats, which is where a
                 seat becomes a participant number.
        idl.game.dto.CreateSessionResponse:
            type: object
            properties:
                session:
                    $ref: '#/components/schemas/idl.game.model.SessionView'
        idl.game.dto.ListGameSpecRequest:
            type: object
            properties: {}
        idl.game.dto.ListGameSpecResponse:
            type: object
            properties:
                collection:
                    $ref: '#/components/schemas/idl.game.model.GameSpecCollection'
        idl.game.dto.ReadSessionRequest:
            type: object
            properties:
                sessionId:
                    type: string
                playerId:
                    type: string
        idl.game.dto.ReadSessionResponse:
            type: object
            properties:
                session:
                    $ref: '#/components/schemas/idl.game.model.SessionView'
        idl.game.dto.WithdrawPlayerRequest:
            type: object
            properties:
                sessionId:
                    type: string
                playerId:
                    type: string
            description: |-
                Take a player out of the game at a table.

                 Sent when the player leaves the table, whoever's turn it is. A game with a
                 result is left as it is. `version` is not carried: nothing is built against
                 the game here, and the withdrawal is written against the game as it stands.
        idl.game.dto.WithdrawPlayerResponse:
            type: object
            properties:
                result:
                    $ref: '#/components/schemas/idl.game.model.WithdrawalResult'
        idl.game.model.CommandResult:
            type: object
            properties:
                outcome:
                    enum:
                        - COMMAND_OUTCOME_UNSPECIFIED
                        - COMMAND_OUTCOME_APPLIED
                        - COMMAND_OUTCOME_ALREADY_APPLIED
                        - COMMAND_OUTCOME_SESSION_NOT_FOUND
                        - COMMAND_OUTCOME_NOT_A_PARTICIPANT
                        - COMMAND_OUTCOME_GAME_OVER
                        - COMMAND_OUTCOME_VERSION_MOVED
                        - COMMAND_OUTCOME_OUT_OF_TURN
                        - COMMAND_OUTCOME_ILLEGAL_ACTION
                    type: string
                    format: enum
                session:
                    $ref: '#/components/schemas/idl.game.model.SessionView'
            description: |-
                What happened to a command, and the game as its sender may now see it.

                 The session is carried whatever the outcome, and is unset only when no game
                 is stored under the id the command named.
        idl.game.model.GameResult:
            type: object
            properties:
                participantItems:
                    type: array
                    items:
                        $ref: '#/components/schemas/idl.game.model.ParticipantResult'
            description: |-
                How a finished game came out, one entry per participant.

                 A game of more than two says what each of them got. No score is carried: a
                 game that is scored rather than won says so in its own state.
        idl.game.model.GameSpec:
            type: object
            properties:
                gameType:
                    enum:
                        - GAME_TYPE_UNSPECIFIED
                        - GAME_TYPE_CHESS
                        - GAME_TYPE_UNO
                    type: string
                    format: enum
                bounds:
                    $ref: '#/components/schemas/idl.game.model.ParticipantBounds'
            description: One game, and what it takes to play it.
        idl.game.model.GameSpecCollection:
            type: object
            properties:
                gameSpecItems:
                    type: array
                    items:
                        $ref: '#/components/schemas/idl.game.model.GameSpec'
            description: |-
                Every game this system hosts.

                 What every listing of games answers with. A count or the filter a listing was
                 answered under belongs here.
        idl.game.model.GameState:
            type: object
            properties:
                payload:
                    $ref: '#/components/schemas/google.protobuf.Any'
                participantsToAct:
                    type: array
                    items:
                        type: integer
                        format: uint32
                result:
                    $ref: '#/components/schemas/idl.game.model.GameResult'
                actsWithin:
                    pattern: ^-?(?:0|[1-9][0-9]{0,11})(?:\.[0-9]{1,9})?s$
                    type: string
                participantStatuses:
                    type: array
                    items:
                        $ref: '#/components/schemas/idl.game.model.ParticipantStatus'
            description: |-
                One game, and the things about it that are true whatever game it is.

                 `payload` is the game's own state. It is kept and handed back to that game's
                 rules unopened, and only that game can read it. Its type is what `Any` carries
                 and is not repeated here.

                 `participants_to_act` is everyone who may act on this state. A game of turns
                 names one; a game where others may react to what was just done names each of
                 them. Whichever of them acts first produces the next state, and the rest act
                 on that one. Empty once the game has a result.

                 `participant_statuses` is what everyone may see of each participant: one
                 entry per participant, in participant order, each carrying the conditions
                 the game says they are in. A game with nothing to say leaves it empty.

                 `acts_within` is how long this state stands with nobody acting before the
                 rules are asked what it becomes. It is measured from the write that stores
                 the state, and each state the rules answer carries its own. Unset when the
                 state stands until someone acts.
        idl.game.model.Participant:
            type: object
            properties:
                number:
                    type: integer
                    format: uint32
                playerId:
                    type: string
                role:
                    $ref: '#/components/schemas/google.protobuf.Any'
            description: |-
                A player taking part in a game, and their place in its turn order.

                 `number` is fixed when the game is created and never changes. Numbered from
                 1, so 0 means no participant wherever one is named.

                 `role` is what the participant is in the game's own vocabulary, packed by the
                 game and opened only by the game. It is handed to the rules when the game is
                 created and never changes after. A game with no roles leaves it unset.

                 A player id never reaches a game's rules; the rules are told a
                 ParticipantRole.
        idl.game.model.ParticipantBounds:
            type: object
            properties:
                minimum:
                    type: integer
                    format: uint32
                maximum:
                    type: integer
                    format: uint32
            description: |-
                The number of participants a game can be played by.

                 A bound on how many a game may be started with, not on how many have joined.
        idl.game.model.ParticipantResult:
            type: object
            properties:
                participant:
                    type: integer
                    format: uint32
                outcome:
                    enum:
                        - PARTICIPANT_OUTCOME_UNSPECIFIED
                        - PARTICIPANT_OUTCOME_WON
                        - PARTICIPANT_OUTCOME_LOST
                        - PARTICIPANT_OUTCOME_DRAW
                    type: string
                    format: enum
            description: What one participant got out of a finished game.
        idl.game.model.ParticipantState:
            type: object
            properties:
                kind:
                    enum:
                        - PARTICIPANT_STATE_KIND_UNSPECIFIED
                        - PARTICIPANT_STATE_KIND_HOLDING
                        - PARTICIPANT_STATE_KIND_LAST_ONE
                        - PARTICIPANT_STATE_KIND_WITHDRAWN
                    type: string
                    format: enum
                count:
                    type: integer
                    format: uint32
            description: One condition a participant is in.
        idl.game.model.ParticipantStatus:
            type: object
            properties:
                participant:
                    type: integer
                    format: uint32
                states:
                    type: array
                    items:
                        $ref: '#/components/schemas/idl.game.model.ParticipantState'
            description: |-
                Every condition one participant is in, as everyone at the table may see it.

                 Answered by the game's rules with each state, and never projected: what is
                 said here is public. Whose turn it is and how the game ended are carried
                 elsewhere on the state, so no kind repeats them.
        idl.game.model.SessionView:
            type: object
            properties:
                id:
                    type: string
                gameType:
                    enum:
                        - GAME_TYPE_UNSPECIFIED
                        - GAME_TYPE_CHESS
                        - GAME_TYPE_UNO
                    type: string
                    format: enum
                participants:
                    type: array
                    items:
                        $ref: '#/components/schemas/idl.game.model.Participant'
                participant:
                    type: integer
                    format: uint32
                state:
                    $ref: '#/components/schemas/idl.game.model.GameState'
                lastCommandId:
                    type: string
                version:
                    type: string
                actsBy:
                    type: string
                    format: date-time
            description: |-
                One game as one participant may see it.

                 `state.payload` is the game projected for `participant`, which in a game with
                 hidden information is less than the whole game. A view is rendered, never
                 written back, and never handed to a game's rules.

                 `state.participants_to_act` says whether the viewer may act now, and
                 `acts_by` says until when. Both are the game's, unprojected.

                 A view arrives both as an answer and unasked, so two of them can cross. A
                 client renders one only when its version is above the version it is showing.
        idl.game.model.WithdrawalResult:
            type: object
            properties:
                outcome:
                    enum:
                        - WITHDRAWAL_OUTCOME_UNSPECIFIED
                        - WITHDRAWAL_OUTCOME_WITHDRAWN
                        - WITHDRAWAL_OUTCOME_SESSION_NOT_FOUND
                        - WITHDRAWAL_OUTCOME_NOT_A_PARTICIPANT
                        - WITHDRAWAL_OUTCOME_NOT_IN_GAME
                        - WITHDRAWAL_OUTCOME_GAME_OVER
                        - WITHDRAWAL_OUTCOME_VERSION_MOVED
                    type: string
                    format: enum
                session:
                    $ref: '#/components/schemas/idl.game.model.SessionView'
            description: |-
                What happened to a withdrawal, and the game as the withdrawing player may
                 now see it.

                 The session is carried whatever the outcome, and is unset only when no game
                 is stored under the id the withdrawal named.
        idl.lobby.dto.CreateTableRequest:
            type: object
            properties:
                gameType:
                    enum:
                        - GAME_TYPE_UNSPECIFIED
                        - GAME_TYPE_CHESS
                        - GAME_TYPE_UNO
                    type: string
                    format: enum
                seatCount:
                    type: integer
                    format: uint32
                playerId:
                    type: string
            description: |-
                Open a table for a game, with the opener at it and every seat empty.

                 The table's id is minted by the lobby. `seat_count` must lie within the
                 bounds the game answers for itself.
        idl.lobby.dto.CreateTableResponse:
            type: object
            properties:
                result:
                    $ref: '#/components/schemas/idl.lobby.model.SeatResult'
        idl.lobby.dto.DeleteTableRequest:
            type: object
            properties:
                tableId:
                    type: string
                expectedVersion:
                    type: string
        idl.lobby.dto.DeleteTableResponse:
            type: object
            properties:
                tableId:
                    type: string
        idl.lobby.dto.JoinTableRequest:
            type: object
            properties:
                tableId:
                    type: string
                playerId:
                    type: string
            description: Come to the table without taking a seat.
        idl.lobby.dto.JoinTableResponse:
            type: object
            properties:
                result:
                    $ref: '#/components/schemas/idl.lobby.model.SeatResult'
        idl.lobby.dto.LeaveTableRequest:
            type: object
            properties:
                tableId:
                    type: string
                playerId:
                    type: string
            description: Leave the table, giving up a seat on the way out.
        idl.lobby.dto.LeaveTableResponse:
            type: object
            properties:
                result:
                    $ref: '#/components/schemas/idl.lobby.model.SeatResult'
        idl.lobby.dto.ListTableRequest:
            type: object
            properties: {}
        idl.lobby.dto.ListTableResponse:
            type: object
            properties:
                collection:
                    $ref: '#/components/schemas/idl.lobby.model.TableCollection'
        idl.lobby.dto.ReadTableRequest:
            type: object
            properties:
                tableId:
                    type: string
        idl.lobby.dto.ReadTableResponse:
            type: object
            properties:
                table:
                    $ref: '#/components/schemas/idl.lobby.model.Table'
        idl.lobby.dto.VacateSeatRequest:
            type: object
            properties:
                tableId:
                    type: string
                playerId:
                    type: string
            description: |-
                Give up the seat and stay at the table.

                 A player in a game being played is withdrawn from it first; what that does
                 to the game is the game's own. No version is carried: giving up a seat is not
                 built against a table the player has seen.
        idl.lobby.dto.VacateSeatResponse:
            type: object
            properties:
                result:
                    $ref: '#/components/schemas/idl.lobby.model.SeatResult'
        idl.lobby.model.Seat:
            type: object
            properties:
                number:
                    type: integer
                    format: uint32
                status:
                    enum:
                        - SEAT_STATUS_UNSPECIFIED
                        - SEAT_STATUS_OPEN
                        - SEAT_STATUS_OCCUPIED
                    type: string
                    format: enum
                playerId:
                    type: string
                role:
                    $ref: '#/components/schemas/google.protobuf.Any'
            description: |-
                One place at a table.

                 `number` is the seat's position and never changes once the table is created.
                 Numbered from 1, so 0 means no seat wherever a seat is named.

                 `role` is what the seat is in the game's own vocabulary: the side it plays,
                 the token it moves. It is packed by the game and opened only by the game and
                 by the client that draws it. It is set when the seat is taken, from the
                 choice the player took, and cleared when the seat is vacated. A game whose
                 seats are positions and nothing more leaves it unset.

                 What a game makes of a seat's position and role when it starts is the game's
                 own business.

                 A seat holds a player id and no more. A name to draw is read from identity
                 when it is needed, so a renamed player is never stale here.
        idl.lobby.model.SeatResult:
            type: object
            properties:
                outcome:
                    enum:
                        - SEAT_OUTCOME_UNSPECIFIED
                        - SEAT_OUTCOME_TAKEN
                        - SEAT_OUTCOME_TABLE_NOT_FOUND
                        - SEAT_OUTCOME_NOT_OFFERED
                        - SEAT_OUTCOME_VERSION_MOVED
                        - SEAT_OUTCOME_VACATED
                        - SEAT_OUTCOME_LEFT
                        - SEAT_OUTCOME_NOT_SEATED
                        - SEAT_OUTCOME_NOT_AT_TABLE
                        - SEAT_OUTCOME_CREATED
                        - SEAT_OUTCOME_JOINED
                        - SEAT_OUTCOME_ALREADY_AT_TABLE
                        - SEAT_OUTCOME_NOT_ACCEPTING_PLAYERS
                        - SEAT_OUTCOME_GAME_NOT_HOSTED
                        - SEAT_OUTCOME_SEAT_COUNT_NOT_ALLOWED
                    type: string
                    format: enum
                table:
                    $ref: '#/components/schemas/idl.lobby.model.Table'
            description: |-
                What happened to a player's place at a table, and the table as it now stands.

                 The table is carried whatever the outcome, and is unset only when no table has
                 the id the change named.
        idl.lobby.model.Table:
            type: object
            properties:
                id:
                    type: string
                gameType:
                    enum:
                        - GAME_TYPE_UNSPECIFIED
                        - GAME_TYPE_CHESS
                        - GAME_TYPE_UNO
                    type: string
                    format: enum
                status:
                    enum:
                        - TABLE_STATUS_UNSPECIFIED
                        - TABLE_STATUS_WAITING
                        - TABLE_STATUS_IN_PROGRESS
                        - TABLE_STATUS_FINISHED
                        - TABLE_STATUS_ABANDONED
                    type: string
                    format: enum
                seats:
                    type: array
                    items:
                        $ref: '#/components/schemas/idl.lobby.model.Seat'
                version:
                    type: string
                playerIds:
                    type: array
                    items:
                        type: string
            description: |-
                A table, the people at it, and the seats around it.

                 Holds no game state and no rules. A table names a game and who is playing it;
                 starting one hands the seated roster to the game, and everything after that
                 is the game's.

                 Joining a table and taking a seat are two different things. Anyone may join,
                 and there is no limit on how many have. A seat is taken only by someone who
                 asks for that seat, so nothing ever chooses a seat on a player's behalf. A
                 player in a seat is also in `player_ids`; leaving the table vacates the seat.
        idl.lobby.model.TableCollection:
            type: object
            properties:
                tableItems:
                    type: array
                    items:
                        $ref: '#/components/schemas/idl.lobby.model.Table'
            description: |-
                Many tables.

                 What every listing of tables answers with. A count, a cursor or the filter a
                 listing was answered under belongs here.
        idl.uno.dto.ListSeatChoiceRequest:
            type: object
            properties:
                tableId:
                    type: string
                playerId:
                    type: string
            description: The seats this player may take at this table now.
        idl.uno.dto.ListSeatChoiceResponse:
            type: object
            properties:
                collection:
                    $ref: '#/components/schemas/idl.uno.model.UnoSeatChoiceCollection'
        idl.uno.dto.PlayActionRequest:
            type: object
            properties:
                tableId:
                    type: string
                commandId:
                    type: string
                playerId:
                    type: string
                action:
                    $ref: '#/components/schemas/idl.uno.model.UnoAction'
                expectedVersion:
                    type: string
            description: |-
                One thing a player does in a game.

                 `command_id` is minted by the caller. Sending an action a second time applies
                 nothing and answers the game the first one produced.

                 `expected_version` is the version of the session the action was built against.
                 An action carrying an earlier one is refused, so an action never reaches the
                 game in a position the player who chose it had not seen.

                 The acting participant is not carried. It is found from `player_id`, so a
                 request cannot act for a hand its sender does not hold.
        idl.uno.dto.PlayActionResponse:
            type: object
            properties:
                result:
                    $ref: '#/components/schemas/idl.uno.model.ActionResult'
        idl.uno.dto.ReadGameRequest:
            type: object
            properties:
                tableId:
                    type: string
                playerId:
                    type: string
        idl.uno.dto.ReadGameResponse:
            type: object
            properties:
                session:
                    $ref: '#/components/schemas/idl.uno.model.UnoSession'
        idl.uno.dto.ReadTableRequest:
            type: object
            properties:
                tableId:
                    type: string
        idl.uno.dto.ReadTableResponse:
            type: object
            properties:
                table:
                    $ref: '#/components/schemas/idl.uno.model.UnoTable'
        idl.uno.dto.StartGameRequest:
            type: object
            properties:
                tableId:
                    type: string
                playerId:
                    type: string
            description: |-
                Start a game at a table.

                 Each seat's number is its player's place in the turn order. A table already
                 playing a game starts nothing and answers the game already there.
        idl.uno.dto.StartGameResponse:
            type: object
            properties:
                session:
                    $ref: '#/components/schemas/idl.uno.model.UnoSession'
        idl.uno.dto.TakeSeatRequest:
            type: object
            properties:
                tableId:
                    type: string
                playerId:
                    type: string
                choice:
                    $ref: '#/components/schemas/idl.uno.model.UnoSeatChoice'
                expectedVersion:
                    type: string
            description: |-
                Take one seat, as one of the choices the player was offered.

                 `expected_version` is the version of the table the choice was picked from. A
                 choice carrying an earlier one is refused, so a seat is never taken at a table
                 the player had not seen.
        idl.uno.dto.TakeSeatResponse:
            type: object
            properties:
                result:
                    $ref: '#/components/schemas/idl.uno.model.UnoSeatResult'
        idl.uno.model.ActionResult:
            type: object
            properties:
                outcome:
                    enum:
                        - COMMAND_OUTCOME_UNSPECIFIED
                        - COMMAND_OUTCOME_APPLIED
                        - COMMAND_OUTCOME_ALREADY_APPLIED
                        - COMMAND_OUTCOME_SESSION_NOT_FOUND
                        - COMMAND_OUTCOME_NOT_A_PARTICIPANT
                        - COMMAND_OUTCOME_GAME_OVER
                        - COMMAND_OUTCOME_VERSION_MOVED
                        - COMMAND_OUTCOME_OUT_OF_TURN
                        - COMMAND_OUTCOME_ILLEGAL_ACTION
                    type: string
                    format: enum
                session:
                    $ref: '#/components/schemas/idl.uno.model.UnoSession'
            description: |-
                What happened to an action, and the game as its sender may now see it.

                 The session is carried whatever the outcome, and is unset only when no game is
                 being played at the table the action named.
        idl.uno.model.Card:
            type: object
            properties:
                kind:
                    enum:
                        - CARD_KIND_UNSPECIFIED
                        - CARD_KIND_NUMBER
                        - CARD_KIND_SKIP
                        - CARD_KIND_REVERSE
                        - CARD_KIND_DRAW_TWO
                        - CARD_KIND_WILD
                        - CARD_KIND_WILD_DRAW_FOUR
                    type: string
                    format: enum
                color:
                    enum:
                        - CARD_COLOR_UNSPECIFIED
                        - CARD_COLOR_RED
                        - CARD_COLOR_YELLOW
                        - CARD_COLOR_GREEN
                        - CARD_COLOR_BLUE
                    type: string
                    format: enum
                number:
                    type: integer
                    format: uint32
            description: |-
                One card.

                 Carries no identity. Two cards with the same kind, colour and number are
                 interchangeable. `number` is read only when the kind is NUMBER, so a zero
                 there is the 0 card and nowhere else means anything.
        idl.uno.model.CardDraw:
            type: object
            properties: {}
            description: Taking the top card of the draw pile into the hand.
        idl.uno.model.CardPlay:
            type: object
            properties:
                card:
                    $ref: '#/components/schemas/idl.uno.model.Card'
                chosenColor:
                    enum:
                        - CARD_COLOR_UNSPECIFIED
                        - CARD_COLOR_RED
                        - CARD_COLOR_YELLOW
                        - CARD_COLOR_GREEN
                        - CARD_COLOR_BLUE
                    type: string
                    format: enum
            description: |-
                Playing one card from the hand onto the discard pile.

                 `chosen_color` is set exactly when the card is a wild, and names the colour
                 the next player must follow.
        idl.uno.model.HandCard:
            type: object
            properties:
                card:
                    $ref: '#/components/schemas/idl.uno.model.Card'
                isPlayable:
                    type: boolean
            description: One card in the viewer's hand, and whether it may be played now.
        idl.uno.model.TurnPass:
            type: object
            properties: {}
            description: Ending the turn without playing, allowed only after a draw.
        idl.uno.model.UnoAction:
            type: object
            properties:
                play:
                    $ref: '#/components/schemas/idl.uno.model.CardPlay'
                draw:
                    $ref: '#/components/schemas/idl.uno.model.CardDraw'
                pass:
                    $ref: '#/components/schemas/idl.uno.model.TurnPass'
            description: 'One thing a player does: play a card, draw a card, or pass.'
        idl.uno.model.UnoPlayerSummary:
            type: object
            properties:
                participant:
                    type: integer
                    format: uint32
                cardCount:
                    type: integer
                    format: uint32
                hasWithdrawn:
                    type: boolean
            description: What everyone may know about one participant.
        idl.uno.model.UnoResult:
            type: object
            properties:
                winner:
                    type: integer
                    format: uint32
                reason:
                    enum:
                        - UNO_RESULT_REASON_UNSPECIFIED
                        - UNO_RESULT_REASON_HAND_EMPTIED
                        - UNO_RESULT_REASON_OTHERS_WITHDREW
                    type: string
                    format: enum
            description: How a finished game came out.
        idl.uno.model.UnoSeat:
            type: object
            properties:
                number:
                    type: integer
                    format: uint32
                status:
                    enum:
                        - SEAT_STATUS_UNSPECIFIED
                        - SEAT_STATUS_OPEN
                        - SEAT_STATUS_OCCUPIED
                    type: string
                    format: enum
                playerId:
                    type: string
            description: |-
                One seat at a UNO table.

                 A seat's number is its place in the turn order, and a seat carries nothing
                 else.
        idl.uno.model.UnoSeatChoice:
            type: object
            properties:
                number:
                    type: integer
                    format: uint32
            description: |-
                One seat a player may take right now.

                 Taken unchanged.
        idl.uno.model.UnoSeatChoiceCollection:
            type: object
            properties:
                unoSeatChoiceItems:
                    type: array
                    items:
                        $ref: '#/components/schemas/idl.uno.model.UnoSeatChoice'
            description: Every seat one player may take.
        idl.uno.model.UnoSeatResult:
            type: object
            properties:
                outcome:
                    enum:
                        - SEAT_OUTCOME_UNSPECIFIED
                        - SEAT_OUTCOME_TAKEN
                        - SEAT_OUTCOME_TABLE_NOT_FOUND
                        - SEAT_OUTCOME_NOT_OFFERED
                        - SEAT_OUTCOME_VERSION_MOVED
                        - SEAT_OUTCOME_VACATED
                        - SEAT_OUTCOME_LEFT
                        - SEAT_OUTCOME_NOT_SEATED
                        - SEAT_OUTCOME_NOT_AT_TABLE
                        - SEAT_OUTCOME_CREATED
                        - SEAT_OUTCOME_JOINED
                        - SEAT_OUTCOME_ALREADY_AT_TABLE
                        - SEAT_OUTCOME_NOT_ACCEPTING_PLAYERS
                        - SEAT_OUTCOME_GAME_NOT_HOSTED
                        - SEAT_OUTCOME_SEAT_COUNT_NOT_ALLOWED
                    type: string
                    format: enum
                table:
                    $ref: '#/components/schemas/idl.uno.model.UnoTable'
            description: |-
                What happened to a seat being taken, and the table as its taker may now see it.

                 The table is carried whatever the outcome, and is unset only when no table
                 has the id the choice named.
        idl.uno.model.UnoSession:
            type: object
            properties:
                id:
                    type: string
                view:
                    $ref: '#/components/schemas/idl.uno.model.UnoView'
                participant:
                    type: integer
                    format: uint32
                lastCommandId:
                    type: string
                version:
                    type: string
                participantStatuses:
                    type: array
                    items:
                        $ref: '#/components/schemas/idl.game.model.ParticipantStatus'
            description: |-
                One game of UNO being played, projected for one viewer.

                 The id is the id of the table the game is played at, so a table holds one
                 game at a time.

                 `participant` is the viewer's number in the game, and 0 for someone who is
                 not playing.

                 `version` counts writes to the game. An action is built against the version
                 it was read at, and a session is rendered only when its version is above the
                 version showing.
        idl.uno.model.UnoTable:
            type: object
            properties:
                id:
                    type: string
                status:
                    enum:
                        - TABLE_STATUS_UNSPECIFIED
                        - TABLE_STATUS_WAITING
                        - TABLE_STATUS_IN_PROGRESS
                        - TABLE_STATUS_FINISHED
                        - TABLE_STATUS_ABANDONED
                    type: string
                    format: enum
                seats:
                    type: array
                    items:
                        $ref: '#/components/schemas/idl.uno.model.UnoSeat'
                playerIds:
                    type: array
                    items:
                        type: string
                version:
                    type: string
            description: |-
                A table UNO is played at.

                 `version` is the table's, and a choice is taken against it.
        idl.uno.model.UnoView:
            type: object
            properties:
                players:
                    type: array
                    items:
                        $ref: '#/components/schemas/idl.uno.model.UnoPlayerSummary'
                hand:
                    type: array
                    items:
                        $ref: '#/components/schemas/idl.uno.model.HandCard'
                topCard:
                    $ref: '#/components/schemas/idl.uno.model.Card'
                activeColor:
                    enum:
                        - CARD_COLOR_UNSPECIFIED
                        - CARD_COLOR_RED
                        - CARD_COLOR_YELLOW
                        - CARD_COLOR_GREEN
                        - CARD_COLOR_BLUE
                    type: string
                    format: enum
                direction:
                    enum:
                        - PLAY_DIRECTION_UNSPECIFIED
                        - PLAY_DIRECTION_CLOCKWISE
                        - PLAY_DIRECTION_COUNTERCLOCKWISE
                    type: string
                    format: enum
                participantToAct:
                    type: integer
                    format: uint32
                drawPileCount:
                    type: integer
                    format: uint32
                mayDraw:
                    type: boolean
                mayPass:
                    type: boolean
                drawnCard:
                    $ref: '#/components/schemas/idl.uno.model.Card'
                result:
                    $ref: '#/components/schemas/idl.uno.model.UnoResult'
            description: |-
                The game projected for one viewer.

                 `hand` is the viewer's own cards and is empty for someone who is not
                 playing. `may_draw` and `may_pass` are true only for the viewer whose turn
                 it is; every card's `is_playable` is false for anyone else. Nothing here
                 decides an action; the rules do, and this says what they would accept.
tags:
    - name: ChessService
      description: |-
        Chess as it is played at a table.

         Every request and answer is chess's own type, so a caller never packs or opens
         a payload. A seat changes hands by taking a choice and in no other way, and a
         game changes by playing an action and in no other way.
    - name: GameSpecService
      description: The catalogue of games, assembled from what each game answers about itself.
    - name: SeatService
      description: |-
        A player's place at a table: how it is opened, come to, and given up.

         Giving a seat up, by vacating it or by leaving, withdraws the player from a
         game being played at the table before the table is written, so a game is
         never left waiting on a player who has gone.
    - name: SessionService
      description: |-
        A game being played, and the two ways to change one.

         A game changes by a participant applying a command, or by a player being
         withdrawn from it, and in no other way. There is no write of a state, so no
         caller can set one.
    - name: TableService
      description: |-
        Tables as stored, read and retired.

         No method here writes a table. Every write is a SeatService verb, which the
         lobby decides and records as an event; a table read here is the result of
         those.
    - name: UnoService
      description: |-
        UNO as it is played at a table.

         Every request and answer is UNO's own type, so a caller never packs or opens
         a payload. A seat changes hands by taking a choice and in no other way, and a
         game changes by playing an action and in no other way. A game is answered as
         the caller may see it: their own hand, and a count of everyone else's.
