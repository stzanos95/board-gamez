# What has to be true before a commit lands.
#
#   ./setup.sh                  install pre-commit and wire both hook types
#   pre-commit run --all-files  check the whole tree now, without committing
#   git commit --no-verify      skip the hooks for one commit
#
# There is no workspace root here, and this file does not invent one. Ruff
# resolves its settings per file, walking up to the nearest pyproject.toml, so
# every package and deployable keeps its own [tool.ruff] — including the banned
# `__future__.annotations` — and nothing is repeated below.

# A hook that names no stage runs at every stage, so this pins the default to the
# commit rather than leaving each one to say so. A hook that has to guard the
# push instead names `stages: [pre-push]` itself.
default_stages: [pre-commit]

# The push is wired because four of the pre-commit-hooks below name pre-push in
# their own manifest, which a default here does not override, and so that adding
# a hook that guards the push later needs no one to reinstall.
default_install_hook_types: [pre-commit, pre-push]

# Nothing under these two directories was written here, and neither is ours to
# reformat. idl/contracts/gen is machine output down to its pyproject.toml and
# package.json, which are rendered from idl/scripts/templates — ruff would reject
# the generated modules and the whitespace hooks would rewrite them, so every
# regeneration would fight the hooks. Their correctness is checked by
# regenerating them, which ./idl/scripts/check.sh does. idl/third_party is
# vendored from googleapis.
exclude: '^idl/(contracts/gen|third_party)/'

repos:
  # Held at the version both projects lock. The hook, ./infra/scripts/lint.sh
  # and your editor are then the same linter, and cannot disagree about what is
  # already formatted. Moving it means moving the floor in both pyproject.toml.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.6
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
        # The shipped hook also formats Python fenced in Markdown, which rewrites
        # the examples in the python-style skill: it strips their aligned
        # `# yes` / `# no` columns and pads the snippets with blank lines. The
        # style guide is prose about code, so it is not the formatter's to own.
        types_or: [python, pyi, jupyter]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: check-yaml
      - id: check-toml
      # The reverse check — that every executable has a shebang — is deliberately
      # absent: both scripts/_shared.sh files are executable but are sourced, not
      # run, so they correctly have no shebang.
      - id: check-shebang-scripts-are-executable

  # Type checking runs on the commit that introduces the code, so a type error is
  # reported against the change that caused it rather than against a push
  # carrying several. Each project is checked from its own directory in its own
  # environment, because each stands alone; `files` keeps a README-only commit
  # from paying for any of them.
  #
  # Every project with Python in it has a hook here. One that is missing is not
  # checked anywhere, and nothing else reports that it is missing.
  #
  # `python -m mypy`, not `mypy`, matching docker/entrypoint.sh. A venv's console
  # scripts hard-code the absolute path of the interpreter that created them, so
  # after the checkout is moved or renamed `mypy` fails to spawn while the venv
  # still looks valid to uv. Reaching the module through the interpreter has no
  # such path baked in and survives the move.
  - repo: local
    hooks:
      - id: mypy-core
        name: mypy (packages/core)
        entry: uv run --directory packages/core --quiet python -m mypy
        language: system
        types: [python]
        files: ^packages/core/
        pass_filenames: false

      - id: mypy-chess
        name: mypy (packages/chess)
        entry: uv run --directory packages/chess --quiet python -m mypy
        language: system
        types: [python]
        files: ^packages/chess/
        pass_filenames: false

      - id: mypy-lobby
        name: mypy (packages/lobby)
        entry: uv run --directory packages/lobby --quiet python -m mypy
        language: system
        types: [python]
        files: ^packages/lobby/
        pass_filenames: false

      - id: mypy-game
        name: mypy (packages/game)
        entry: uv run --directory packages/game --quiet python -m mypy
        language: system
        types: [python]
        files: ^packages/game/
        pass_filenames: false

      - id: mypy-chess-cli
        name: mypy (deployables/chess-cli)
        entry: uv run --directory deployables/chess-cli --quiet python -m mypy
        language: system
        types: [python]
        files: ^deployables/chess-cli/
        pass_filenames: false

      - id: mypy-fastapi-gateway
        name: mypy (deployables/fastapi-gateway)
        entry: uv run --directory deployables/fastapi-gateway --quiet python -m mypy
        language: system
        types: [python]
        files: ^deployables/fastapi-gateway/
        pass_filenames: false

      - id: mypy-grpc-server
        name: mypy (deployables/grpc-server)
        entry: uv run --directory deployables/grpc-server --quiet python -m mypy
        language: system
        types: [python]
        files: ^deployables/grpc-server/
        pass_filenames: false
