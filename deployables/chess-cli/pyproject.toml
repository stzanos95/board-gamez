[project]
name = "chess-cli"
version = "0.1.0"
description = "A two-player chess game for the terminal."
requires-python = ">=3.13"
dependencies = [
    "chess-game",
    # Settings are a dataclass parsed from YAML; the yaml extra brings the loader.
    "mashumaro[yaml]>=3.13",
]

[project.scripts]
chess = "main:main"

# A relative path source rather than a workspace: each project here stands alone,
# and nothing needs uv installed on the host to read this.
[tool.uv.sources]
chess-game = { path = "../../packages/chess", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["src_python"]
sources = ["src_python"]

[dependency-groups]
# The ruff floor matches the rev pinned in .pre-commit-config.yaml, so the
# hook, this environment and ./infra/scripts/lint.sh format identically.
dev = ["pytest>=8.0", "mypy>=1.11", "ruff>=0.16.6", "types-PyYAML>=6.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src_python", "."]

[tool.mypy]
python_version = "3.13"
strict = true
disallow_any_explicit = true
mypy_path = "src_python"
files = ["src_python", "tests"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src_python", "tests"]

[tool.ruff.lint]
preview = true
explicit-preview-rules = true
select = [
    "E", "F", "I", "N", "UP", "B", "SIM", "RUF",
    "TID251",
    "PLC0415",
    "PLR2004",
]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"__future__.annotations" = { msg = "Annotations must stay real runtime objects — see the python-style skill, rule 1. Use a string forward ref such as -> \"ChessBoard\" instead." }
