# What the browser talks to.
#
# Three jobs: hand out the bundle, forward calls to the gateway, and forward
# sockets to the socket server, so the application makes no cross-origin
# request. When authentication arrives, the cookie it sets is same-origin for
# the same reason.
#
# The upstreams are named by their compose services. To serve against a
# gateway or a socket server somewhere else, mount your own file over this one.

server {
    listen 8081;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The settings document, and never a cached copy of it: mounting a
    # different one takes effect on the next reload.
    location = /gamez_ux.json {
        add_header Cache-Control "no-store" always;
    }

    # Everything the schema declares is served under this prefix. The prefix is
    # stripped, so the path the gateway sees is the path the .proto names.
    location /api/ {
        proxy_pass http://fastapi-gateway:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # A socket a browser opens on a table or on the lobby. The upgrade headers
    # are passed through, and the read timeout is long because the server
    # pushes rarely and pings on its own.
    location /ws/ {
        proxy_pass http://websocket-server:8082/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    # The bundle carries a content hash in its name, so it can be held for a
    # long time. index.html cannot: it is what names the current bundle.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # One page, and the route lives in the fragment, so every path answers with
    # it.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
    }
}
