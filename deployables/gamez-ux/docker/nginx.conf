# What the browser talks to.
#
# Two jobs: hand out the bundle, and forward calls to the gateway so the
# application makes no cross-origin request. When authentication arrives, the
# cookie it sets is same-origin for the same reason.
#
# The upstream is named by its compose service. To serve against a gateway
# somewhere else, mount your own file over this one.

server {
    listen 8081;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The settings document, and never a cached copy of it: mounting a
    # different one takes effect on the next reload.
    location = /gamez_ux.json {
        add_header Cache-Control "no-store" always;
    }

    # Everything the schema declares is served under this prefix. The prefix is
    # stripped, so the path the gateway sees is the path the .proto names.
    location /api/ {
        proxy_pass http://fastapi-gateway:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The bundle carries a content hash in its name, so it can be held for a
    # long time. index.html cannot: it is what names the current bundle.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # One page, and the route lives in the fragment, so every path answers with
    # it.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
    }
}
