[project]
name = "grpc-server"
version = "0.1.0"
description = "The internal gRPC services of the board-gamez platform."
requires-python = ">=3.13"
dependencies = [
    # The servicers this process serves, ready made. A domain package owns its
    # implementation and its registration; the server only registers them.
    "lobby",
    "game",
    # The one product served: the rules of chess the session layer asks
    # in-process, and the service a browser plays chess through.
    "product-chess",
    # The channel arguments both ends of a call are tuned with.
    "core",
    "grpcio>=1.68.1",
    # Answers which services are served, so a client needs no .proto files.
    "grpcio-reflection>=1.68.1",
    # Settings are a dataclass parsed from YAML; the yaml extra brings the loader.
    "mashumaro[yaml]>=3.22",
]

# Relative path sources rather than a workspace: each project here stands alone.
[tool.uv.sources]
lobby = { path = "../../packages/lobby", editable = true }
game = { path = "../../packages/game", editable = true }
product-chess = { path = "../../packages/product-chess", editable = true }
core = { path = "../../packages/core", editable = true }

[project.scripts]
grpc-server = "main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["src_python"]
sources = ["src_python"]

[dependency-groups]
# The ruff floor matches the rev pinned in .pre-commit-config.yaml, so the
# hook, this environment and ./infra/scripts/lint.sh format identically.
# Neither protobuf nor grpcio ships type information of its own, so the stubs are
# what keeps every message and every call here from being Any to a type checker.
dev = [
    "pytest>=9.1.1",
    "mypy>=2.3.1",
    "ruff>=0.16.6",
    "types-protobuf>=5.28",
    "types-grpcio>=1.83",
    "types-grpcio-reflection>=1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src_python", "."]

[tool.mypy]
python_version = "3.13"
strict = true
disallow_any_explicit = true
mypy_path = "src_python"
files = ["src_python", "tests"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src_python", "tests"]

[tool.ruff.lint]
preview = true
explicit-preview-rules = true
select = [
    "E", "F", "I", "N", "UP", "B", "SIM", "RUF",
    "TID251",
    "PLC0415",
    "PLR2004",
]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"__future__.annotations" = { msg = "Annotations must stay real runtime objects — see the python-style skill, rule 1. Use a string forward ref such as -> \"ServiceHostConfig\" instead." }
