# Settings for the internal gRPC server.
#
# This file is the app's bringup: it is parsed into ServiceHostConfig, and
# nothing in the app reads the environment. To run with different settings, copy
# this file and pass it:  grpc-server --config /path/to/your.yaml
application:
  name: board-gamez grpc server
  version: "0.1.0"

server:
  # Plain HTTP/2. Transport security is terminated ahead of this process, which
  # is reachable only from inside.
  host: "0.0.0.0"
  port: 50051
  # critical, error, warning, info or debug.
  log_level: info
  # Calls served at once. Anything beyond this waits rather than being refused.
  maximum_concurrent_rpcs: 256
  # A message larger than either limit is refused rather than truncated.
  max_receive_message_bytes: 4194304
  max_send_message_bytes: 4194304
  # How long a call already in flight has to finish once the process has been
  # asked to stop.
  graceful_shutdown_seconds: 10
  # Answer which services are served, so a client needs no .proto files to call
  # one. This is an internal listener; nothing outside reaches it.
  reflection: true

lobby:
  # Where tables are kept. `repository` selects, and the section it names must be
  # present.
  table_repository:
    repository: redis
    redis_config:
      host: "127.0.0.1"
      port: 6379
      database: 0
      # Begins every key this repository writes, so one instance can hold more
      # than one deployment.
      key_prefix: "board-gamez"

game:
  # Where games being played are kept. `repository` selects, and the section it
  # names must be present.
  session_repository:
    repository: redis
    redis_config:
      host: "127.0.0.1"
      port: 6379
      database: 0
      key_prefix: "board-gamez"
  # How often games whose state has run out are looked for. A state is handed
  # to its rules on the first look after its deadline.
  deadlines:
    poll_interval_seconds: 1.0

# Where every write that succeeds is published as an event. `queue` selects, and
# the section it names must be present.
queue:
  queue: redis
  redis_config:
    host: "127.0.0.1"
    port: 6379
    database: 0
    # Begins every channel published on. Set together with the subscribers'.
    channel_prefix: "gamez"
