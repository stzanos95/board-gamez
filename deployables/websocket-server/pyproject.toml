[project]
name = "websocket-server"
version = "0.1.0"
description = "The socket a browser is told over that something changed."
requires-python = ">=3.13"
dependencies = [
    # The queue every event arrives on, the envelope a frame leaves in, and the
    # protobuf runtime reached through one place.
    "core",
    # The events read and the frames sent are the schema's.
    "board-gamez-idl",
    # The socket server: uWebSockets under an asyncio loop.
    "socketify>=0.0.31",
    # Settings are a dataclass parsed from YAML; the yaml extra brings the loader.
    "mashumaro[yaml]>=3.22",
]

# Relative path sources rather than a workspace: each project here stands alone.
[tool.uv.sources]
core = { path = "../../packages/core", editable = true }
board-gamez-idl = { path = "../../idl/contracts/gen/python", editable = true }

[project.scripts]
websocket-server = "main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["src_python"]
sources = ["src_python"]

[dependency-groups]
# The ruff floor matches the rev pinned in .pre-commit-config.yaml, so the
# hook, this environment and ./infra/scripts/lint.sh format identically.
# protobuf ships no type information of its own, so the stubs are what keeps
# every message here from being Any to a type checker.
dev = ["pytest>=9.1.1", "mypy>=2.3.1", "ruff>=0.16.6", "types-protobuf>=5.28"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src_python", "."]

[tool.mypy]
python_version = "3.13"
strict = true
disallow_any_explicit = true
mypy_path = "src_python"
files = ["src_python", "tests"]

# socketify ships no type information. The surface this server uses is modelled
# as protocols in websocket_server/service/socketify_types.py, which is what
# every handler is typed against.
[[tool.mypy.overrides]]
module = "socketify.*"
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src_python", "tests"]

[tool.ruff.lint]
preview = true
explicit-preview-rules = true
select = [
    "E", "F", "I", "N", "UP", "B", "SIM", "RUF",
    "TID251",
    "PLC0415",
    "PLR2004",
]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"__future__.annotations" = { msg = "Annotations must stay real runtime objects — see the python-style skill, rule 1. Use a string forward ref such as -> \"WebsocketServerConfig\" instead." }
