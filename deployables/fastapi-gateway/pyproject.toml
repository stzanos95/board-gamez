[project]
name = "fastapi-gateway"
version = "0.1.0"
description = "The HTTP gateway to the board-gamez platform."
requires-python = ">=3.13"
dependencies = [
    # The routers this gateway serves, ready made. A domain package owns its
    # paths, its adapter and its binding; the gateway only includes them.
    "lobby",
    "game",
    # The one product served: the paths a browser plays chess through.
    "product-chess",
    # The channel arguments an upstream call is tuned with, and who is calling.
    "core",
    "fastapi>=0.141.1",
    # No [standard] extra: it brings a websocket stack and an HTTP/2 client this
    # process does not use.
    "uvicorn>=0.52.4",
    # Settings are a dataclass parsed from YAML; the yaml extra brings the loader.
    "mashumaro[yaml]>=3.22",
]

# Relative path sources rather than a workspace: each project here stands alone.
[tool.uv.sources]
lobby = { path = "../../packages/lobby", editable = true }
game = { path = "../../packages/game", editable = true }
product-chess = { path = "../../packages/product-chess", editable = true }
core = { path = "../../packages/core", editable = true }

[project.scripts]
fastapi-gateway = "main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["src_python"]
sources = ["src_python"]

[dependency-groups]
# The ruff floor matches the rev pinned in .pre-commit-config.yaml, so the
# hook, this environment and ./infra/scripts/lint.sh format identically.
# protobuf ships no type information of its own, so the stubs are what keeps
# a schema file's descriptor from being Any to a type checker.
dev = ["pytest>=9.1.1", "mypy>=2.3.1", "ruff>=0.16.6", "types-protobuf>=5.28"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src_python", "."]

[tool.mypy]
python_version = "3.13"
strict = true
disallow_any_explicit = true
mypy_path = "src_python"
files = ["src_python", "tests"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src_python", "tests"]

[tool.ruff.lint]
preview = true
explicit-preview-rules = true
select = [
    "E", "F", "I", "N", "UP", "B", "SIM", "RUF",
    "TID251",
    "PLC0415",
    "PLR2004",
]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"__future__.annotations" = { msg = "Annotations must stay real runtime objects — see the python-style skill, rule 1. Use a string forward ref such as -> \"GatewayAPIConfig\" instead." }
