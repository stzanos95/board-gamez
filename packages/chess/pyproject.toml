[project]
name = "chess-game"
version = "0.1.0"
description = "A chess engine: rules, move generation and game state, with no input or output."
requires-python = ">=3.13"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src_python/chess"]

[dependency-groups]
# The ruff floor matches the rev pinned in .pre-commit-config.yaml, so the
# hook, this environment and ./infra/scripts/lint.sh format identically.
dev = ["pytest>=8.0", "mypy>=1.11", "ruff>=0.16.6"]

[tool.pytest.ini_options]
testpaths = ["tests_python"]
pythonpath = ["src_python", "."]

[tool.mypy]
python_version = "3.13"
strict = true
# Rule 3 of the house style: never Any. This is what enforces it.
disallow_any_explicit = true
mypy_path = "src_python"
files = ["src_python", "tests_python"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src_python", "tests_python"]

[tool.ruff.lint]
preview = true
explicit-preview-rules = true
select = [
    "E", "F", "I", "N", "UP", "B", "SIM", "RUF",
    "TID251",   # banned imports — see below
    "PLC0415",  # rule 1: no import outside the top level of a module
    "PLR2004",  # rule 2: no magic value in a comparison
]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"__future__.annotations" = { msg = "Annotations must stay real runtime objects — see the python-style skill, rule 1. Use a string forward ref such as -> \"ChessBoard\" instead." }
