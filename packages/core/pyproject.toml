[project]
name = "core"
version = "0.1.0"
description = "What every domain needs and no domain owns."
requires-python = ">=3.13"
dependencies = [
    # The message these utilities convert, and the model they convert it to.
    # Neither a schema nor a domain: any message and any model will do.
    "protobuf>=5.28.3,<6",
    "pydantic>=2.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src_python/core"]

[dependency-groups]
# The ruff floor matches the rev pinned in .pre-commit-config.yaml, so the
# hook, this environment and ./infra/scripts/lint.sh format identically.
# protobuf ships no type information of its own, so the stubs are what keeps
# every message here from being Any to a type checker.
dev = ["pytest>=9.1.1", "mypy>=2.3.1", "ruff>=0.16.6", "types-protobuf>=5.28"]

[tool.pytest.ini_options]
testpaths = ["tests_python"]
pythonpath = ["src_python", "."]

[tool.mypy]
python_version = "3.13"
strict = true
# Rule 3 of the house style: never Any. This is what enforces it.
disallow_any_explicit = true
mypy_path = "src_python"
files = ["src_python", "tests_python"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src_python", "tests_python"]

[tool.ruff.lint]
preview = true
explicit-preview-rules = true
select = [
    "E", "F", "I", "N", "UP", "B", "SIM", "RUF",
    "TID251",
    "PLC0415",
    "PLR2004",
]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"__future__.annotations" = { msg = "Annotations must stay real runtime objects — see the python-style skill, rule 1. Use a string forward ref such as -> \"ProtobufMessageUtils\" instead." }
