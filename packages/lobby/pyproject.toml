[project]
name = "lobby"
version = "0.1.0"
description = "Tables and the seats around them: the routers a lobby answers, and what answers them."
requires-python = ">=3.13"
dependencies = [
    # The router each service declares, and the models a request arrives as.
    "idl-fastapi",
    # The servicer each service declares, and the messages a call arrives as.
    "board-gamez-idl",
    "grpcio>=1.68.1",
    # Converting one shape of a message into the other.
    "core",
]

# Relative path sources rather than a workspace: each project here stands alone.
[tool.uv.sources]
idl-fastapi = { path = "../../idl/contracts/gen/fastapi", editable = true }
board-gamez-idl = { path = "../../idl/contracts/gen/python", editable = true }
core = { path = "../core", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src_python/lobby"]

[dependency-groups]
# The ruff floor matches the rev pinned in .pre-commit-config.yaml, so the
# hook, this environment and ./infra/scripts/lint.sh format identically.
# protobuf ships no type information of its own, so the stubs are what keeps
# every message here from being Any to a type checker.
dev = ["pytest>=9.1.1", "mypy>=2.3.1", "ruff>=0.16.6", "types-protobuf>=5.28"]

[tool.pytest.ini_options]
testpaths = ["tests_python"]
pythonpath = ["src_python", "."]

[tool.mypy]
python_version = "3.13"
strict = true
# Rule 3 of the house style: never Any. This is what enforces it.
disallow_any_explicit = true
mypy_path = "src_python"
files = ["src_python", "tests_python"]

# grpcio ships no type information and no stub package this repository trusts, so
# the modules it publishes are the one place mypy is told to stop looking. The
# ban on explicit Any still holds for everything written here.
[[tool.mypy.overrides]]
module = ["grpc.*", "grpc_reflection.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src_python", "tests_python"]

[tool.ruff.lint]
preview = true
explicit-preview-rules = true
select = [
    "E", "F", "I", "N", "UP", "B", "SIM", "RUF",
    "TID251",
    "PLC0415",
    "PLR2004",
]

[tool.ruff.lint.per-file-ignores]
# gRPC dispatches on the method names the schema declares, so a servicer keeps
# protobuf's casing. This is the only file where that is true.
"src_python/lobby/service/grpc_table_service.py" = ["N802"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"__future__.annotations" = { msg = "Annotations must stay real runtime objects — see the python-style skill, rule 1. Use a string forward ref such as -> \"HttpTableService\" instead." }
