# Overlay: run the checks instead of the app.
#
#   ../scripts/test.sh
#   ../scripts/lint.sh

services:
  fastapi-gateway:
    command: ["test"]

  gateway-lint:
    image: board-gamez/fastapi-gateway:latest
    build:
      context: ../..
      dockerfile: deployables/fastapi-gateway/docker/Dockerfile
    command: ["lint"]

  gateway-typecheck:
    image: board-gamez/fastapi-gateway:latest
    build:
      context: ../..
      dockerfile: deployables/fastapi-gateway/docker/Dockerfile
    command: ["typecheck"]
