name: board-gamez

services:
  chess-cli:
    build:
      # The repository root, so the engine package is inside the context.
      context: ../..
      dockerfile: deployables/chess-cli/docker/Dockerfile
    image: board-gamez/chess-cli:latest
    # Both are needed for an interactive prompt. Start it with
    # `docker compose run --rm chess-cli`, not `up`.
    stdin_open: true
    tty: true
    command: ["play"]

  fastapi-gateway:
    build:
      # The repository root, so the root .dockerignore applies.
      context: ../..
      dockerfile: deployables/fastapi-gateway/docker/Dockerfile
    image: board-gamez/fastapi-gateway:latest
    # The published port matches the one in the config file the image ships
    # with. Changing either without the other leaves nothing listening here.
    ports:
      - "8080:8080"
    command: ["serve"]
