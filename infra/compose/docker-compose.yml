name: board-gamez

services:
  fastapi-gateway:
    build:
      # The repository root, so the root .dockerignore applies.
      context: ../..
      dockerfile: deployables/fastapi-gateway/docker/Dockerfile
    image: board-gamez/fastapi-gateway:latest
    # The published port matches the one in the config file the image ships
    # with. Changing either without the other leaves nothing listening here.
    ports:
      - "8080:8080"
    # The gateway calls the server. Compose starts the server first; the channel
    # connects lazily, so a server that is not answering yet is not an error.
    depends_on:
      - grpc-server
    command: ["serve"]

  gamez-ux:
    build:
      # The repository root, so packages/ux and the generated contracts are
      # inside the context.
      context: ../..
      dockerfile: deployables/gamez-ux/docker/Dockerfile
    image: board-gamez/gamez-ux:latest
    # The published port matches the one nginx.conf listens on. Changing either
    # without the other leaves nothing listening here.
    ports:
      - "8081:8081"
    # Calls to the gateway are forwarded by nginx, so the browser makes no
    # cross-origin request and the gateway needs no origin allowed.
    depends_on:
      - fastapi-gateway
    command: ["serve"]

  grpc-server:
    build:
      # The repository root, so the root .dockerignore applies.
      context: ../..
      dockerfile: deployables/grpc-server/docker/Dockerfile
    image: board-gamez/grpc-server:latest
    # The published port matches the one in the config file the image ships
    # with. Changing either without the other leaves nothing listening here.
    ports:
      - "50051:50051"
    # Tables are kept in Redis. The hostname is the service name, which is what
    # grpc_server.container.yaml names.
    depends_on:
      - redis
    command: ["serve"]

  redis:
    image: redis:7-alpine
    # Published so the same store answers a server run outside a container, which
    # is what grpc_server.yaml names.
    ports:
      - "6379:6379"
