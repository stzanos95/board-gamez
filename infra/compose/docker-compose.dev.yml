# Overlay: edit the source on the host and rerun without rebuilding the image.
#
#   ../scripts/dev.sh
#
# Safe because the virtualenv lives at /opt/venv, outside the mounted trees. The
# app's settings file is mounted with everything else, so editing
# deployables/fastapi-gateway/config/fastapi_gateway.yaml takes effect on the
# next run.

services:
  fastapi-gateway:
    volumes:
      - ../../deployables/fastapi-gateway:/app/deployables/fastapi-gateway:ro
